<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Minigolf Avontuur 3D</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
  #view { position: fixed; inset: 0; touch-action: none; }
  #view canvas { display: block; touch-action: none; }
  .hidden { display: none !important; }
  .panel { background: rgba(10, 16, 32, .62); border: 1px solid rgba(255,255,255,.18); border-radius: 14px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 6px 24px rgba(0,0,0,.35); }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; padding: 8px 12px; color: #fff; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); transition: transform .1s, background .2s; }
  button:hover { background: rgba(255,255,255,.26); }
  button:active { transform: scale(.95); }
  button.big { font-size: 22px; padding: 12px 34px; background: linear-gradient(180deg,#53d769,#21a33c); border: 0; box-shadow: 0 6px 0 #146b27, 0 10px 24px rgba(0,0,0,.4); font-weight: bold; letter-spacing: 1px; }
  button.big:hover { filter: brightness(1.08); }
  button.sel { background: #ffcc33; color: #222; font-weight: bold; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hudLeft { position: absolute; left: 12px; top: 12px; padding: 10px 14px; min-width: 210px; pointer-events: none; }
  #hHole { font-size: 13px; opacity: .8; letter-spacing: 1px; text-transform: uppercase; }
  #hName { font-size: 21px; font-weight: bold; margin: 2px 0 6px; }
  #hudLeft .row { display: flex; gap: 14px; font-size: 14px; }
  #hudLeft b { font-size: 18px; color: #ffd84a; }
  #hPlayer { margin-top: 6px; font-size: 14px; display: flex; align-items: center; gap: 6px; }
  #hPlayer i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 2px solid #fff; }
  #hudRight { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 60vw; pointer-events: auto; }
  #hudRight button { background: rgba(10,16,32,.62); backdrop-filter: blur(6px); }
  #hudRight button.on { background: #ffcc33; color: #222; }
  #powerWrap { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(420px, 80vw); text-align: center; }
  #powerBar { position: relative; height: 18px; border-radius: 9px; overflow: hidden; border: 2px solid rgba(255,255,255,.7); background: linear-gradient(90deg,#2ecc40,#ffdc00 50%,#ff4136); box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  #powerMask { position: absolute; right: 0; top: 0; bottom: 0; width: 100%; background: rgba(15,20,35,.88); }
  #powerLabel { font-size: 12px; margin-top: 4px; opacity: .85; text-shadow: 0 1px 2px #000; }
  #banner { position: fixed; left: 50%; top: 30%; transform: translate(-50%,-50%); text-align: center; pointer-events: none; opacity: 0; transition: opacity .5s; text-shadow: 0 3px 12px rgba(0,0,0,.7); width: 92vw; }
  #banner.show { opacity: 1; }
  #banner .t1 { font-size: 16px; letter-spacing: 4px; text-transform: uppercase; opacity: .85; }
  #banner .t2 { font-size: clamp(30px, 7vw, 60px); font-weight: bold; }
  #toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%) scale(.8); font-size: 26px; font-weight: bold; pointer-events: none; opacity: 0; transition: all .35s; text-shadow: 0 2px 8px #000; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translateX(-50%) scale(1); }
  .screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, rgba(10,20,40,.35), rgba(5,8,18,.8)); z-index: 10; padding: 16px; }
  .card { padding: 24px 28px; max-width: 640px; width: 100%; text-align: center; max-height: 94vh; overflow: auto; }
  #menu h1 { font-size: clamp(34px, 8vw, 64px); margin: 0 0 4px; line-height: 1; background: linear-gradient(180deg,#fff7b0,#ffb22e 60%,#ff7a1a); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 rgba(0,0,0,.35)); }
  #menu .sub { opacity: .85; margin-bottom: 14px; }
  .controls { text-align: left; font-size: 14px; line-height: 1.55; background: rgba(0,0,0,.25); border-radius: 10px; padding: 10px 14px; margin: 12px 0; }
  .controls b { color: #ffd84a; }
  .players { display: flex; gap: 8px; justify-content: center; margin: 10px 0 16px; flex-wrap: wrap; }
  #best { font-size: 14px; opacity: .85; margin-top: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 10px 0; }
  th, td { padding: 5px 4px; border-bottom: 1px solid rgba(255,255,255,.15); text-align: center; }
  th { color: #ffd84a; font-weight: normal; }
  .lbl { font-size: clamp(30px, 7vw, 52px); font-weight: bold; margin: 6px 0; animation: pop .7s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes pop { from { transform: scale(0) rotate(-20deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
  .good { color: #6dff8a; } .par { color: #9fd3ff; } .bad { color: #ff8a65; } .ace { color: #ffd84a; }
  .rating { font-size: 24px; color: #ffd84a; margin: 8px 0; }
  .scrollx { overflow-x: auto; }
  .menuBtns { display: flex; flex-direction: column; gap: 12px; align-items: center; margin: 6px 0 12px; }
  .menuBtns .big { width: min(320px, 86vw); }
  button.big.alt { background: linear-gradient(180deg,#4fc3f7,#1e88e5); box-shadow: 0 6px 0 #0d47a1, 0 10px 24px rgba(0,0,0,.4); }
  .row2 { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .card.wide { max-width: 860px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin: 12px 0; }
  .hcard { text-align: left; padding: 12px; border-radius: 12px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); cursor: pointer; transition: transform .12s, background .2s; }
  .hcard:hover { background: rgba(255,255,255,.18); transform: translateY(-2px); }
  .hcard .ic { font-size: 28px; } .hcard .nm { font-weight: bold; font-size: 16px; margin: 4px 0 2px; } .hcard .th { opacity: .75; font-size: 13px; } .hcard .st { margin-top: 6px; font-size: 13px; } .hcard .st b { color: #ffd84a; }
  .world { margin: 10px 0 14px; padding: 10px; border-radius: 14px; background: rgba(0,0,0,.22); }
  .world .wh { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; text-align: left; }
  .world .wh .ic { font-size: 26px; } .world .wh .wn { font-weight: bold; font-size: 18px; flex: 1; } .world .wh .wb { font-size: 13px; opacity: .85; } .world .wh .wb b { color: #ffd84a; }
  .wgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
  .wgrid .hcard { padding: 9px 10px; } .wgrid .hcard .nm { font-size: 14px; }
  @media (max-width: 520px) { .wgrid .hcard .ic { display: none; } .wgrid .hcard .nm { font-size: 12.5px; } .wgrid .hcard .th, .wgrid .hcard .st { font-size: 11.5px; } }
  .instr { text-align: left; font-size: 14px; line-height: 1.5; }
  .instr h3 { margin: 14px 0 6px; color: #ffd84a; font-size: 16px; }
  .instr ul { margin: 0; padding-left: 18px; } .instr li { margin: 3px 0; }
  .instr .el { margin: 6px 0; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,.06); }
  #bHelp { font-weight: bold; min-width: 40px; }
</style>
</head>
<body>
<div id="view"></div>

<div id="hud" class="hidden">
  <div id="hudLeft" class="panel">
    <div id="hHole">Hole 1</div>
    <div id="hName">-</div>
    <div class="row"><span>Par <b id="hPar">2</b></span><span>Slagen <b id="hStrokes">0</b></span><span>Totaal <b id="hTotal">0</b></span></div>
    <div id="hPlayer"></div>
  </div>
  <div id="hudRight">
    <button id="bHelp" title="Instructies">?</button>
    <button id="bRestart" title="Herstart hole">⟲ Herstart</button>
    <button id="bOverview" title="Overzicht (O)">🗺 Overzicht</button>
    <button id="bSound" title="Geluid (M)">🔊</button>
    <button id="bPause" title="Pauze (P)">⏸</button>
  </div>
  <div id="powerWrap"><div id="powerBar"><div id="powerMask"></div></div><div id="powerLabel">Kracht</div></div>
</div>
<div id="banner"></div>
<div id="toast"></div>

<div id="menu" class="screen">
  <div class="card panel">
    <h1>Minigolf Avontuur</h1>
    <div class="sub">9 werelden · 27 banen · banen die veranderen</div>
    <div class="players" id="playerSel">
      <button data-n="1" class="sel">1 speler</button><button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button>
    </div>
    <div class="menuBtns">
      <button class="big" id="bStart">▶ ALLE 27 HOLES</button>
      <button class="big alt" id="bPick">🗺 KIES WERELD OF HOLE</button>
    </div>
    <div class="row2"><button id="bInstr">❓ Instructies</button><button id="bQual">⚙ Kwaliteit: hoog</button></div>
    <div id="best"></div>
  </div>
</div>

<div id="pickScr" class="screen hidden"><div class="card panel wide">
  <h2 style="margin:0">Kies een wereld of hole</h2>
  <div style="opacity:.8;font-size:14px;margin-top:4px">Een wereld = de 3 holes van een thema na elkaar, met scorekaart.</div>
  <div id="holeGrid"></div>
  <button id="bPickBack">← Terug</button>
</div></div>
<div id="instrScr" class="screen hidden" style="z-index:20"><div class="card panel wide instr" id="instrCard"></div></div>

<div id="choiceScr" class="screen hidden"><div class="card panel">
  <h2 style="margin:0 0 6px">Al <span id="chN">10</span> slagen!</h2>
  <div>Wil je stoppen of nog even doorspelen?</div><br>
  <button class="big" id="bGoOn">⛳ VERDER SPELEN</button><br><br>
  <button id="bStop">🏳 Stoppen <span id="chScore"></span></button>
</div></div>
<div id="scorePop" class="screen hidden"><div class="card panel" id="scoreCard"></div></div>
<div id="final" class="screen hidden"><div class="card panel" id="finalCard"></div></div>
<div id="pauseScr" class="screen hidden"><div class="card panel">
  <h2>Pauze</h2>
  <button class="big" id="bResume">VERDER</button><br><br>
  <div class="row2"><button id="bInstr2">❓ Instructies</button><button id="bQual2">⚙ Kwaliteit</button><button id="bQuit">⌂ Startscherm</button></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script><!-- voor de Blender-decor (optioneel) -->
<script>
'use strict';
/* =====================================================================
   MINIGOLF AVONTUUR 3D
   - Fysica in 2D (x,z) met vaste timestep (120 Hz) + adaptieve substeps
   - Alles wordt gerenderd in 3D met Three.js (r128)
   - Holes zijn data (HOLES-array); één generieke engine bouwt en simuleert ze
   ===================================================================== */

// ---------- Constanten ----------
const BALL_R = 0.22;          // straal van de bal
const HOLE_R = 0.42;          // straal van het gat
const MAX_SPEED = 24;         // maximale afslagsnelheid
const MAX_V = 32;             // absolute snelheidslimiet (na botsingen)
const STEP = 1 / 120;         // vaste fysica-timestep
const G_SLOPE = 14;           // 'zwaartekracht' voor hellingen
const CAPTURE_SPEED = 4.3;    // onder deze snelheid valt de bal in het gat
const SHOT_READY = 0.3;       // onder deze snelheid mag je opnieuw slaan
const STOP_SPEED = 0.06;      // onder deze snelheid stopt de bal volledig
const MAX_STROKES = 10;      // vanaf hier mag je kiezen: stoppen (+2 strafslagen) of doorspelen
const STOP_PENALTY = 2;
const WALL_T = 0.3, WALL_H = 0.5;
const CUP_D = 0.24;           // diepte van de cup (boven het water- en lavaniveau)

// Ondergronden: mu = constante rolweerstand (eenheden/s²), k = snelheidsafhankelijke demping
const SURF = {
  grass:  { mu: 2.0,  k: 0.35 },
  wood:   { mu: 2.2,  k: 0.40 },
  stone:  { mu: 2.1,  k: 0.36 },
  rock:   { mu: 2.3,  k: 0.40 },
  metal:  { mu: 1.7,  k: 0.30 },
  carpet: { mu: 2.4,  k: 0.45 },
  sand:   { mu: 7.5,  k: 1.80 },
  snow:   { mu: 6.0,  k: 1.60 },
  mud:    { mu: 4.6,  k: 1.30 },
  ice:    { mu: 0.22, k: 0.03 },
  lowg:   { mu: 0.5,  k: 0.07 },
  slope:  { mu: 2.0,  k: 0.35 },
};
// Gevaarlijke zones (out of bounds)
const HAZARD = { water: 1, lava: 1, abyss: 1, quicksand: 1 };

// ---------- Hulpfuncties ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;
function mulberry(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// Vorm-helpers voor de hole-data (punten als [x, z])
const RECT = (x1, z1, x2, z2) => [[x1, z1], [x2, z1], [x2, z2], [x1, z2]];
const CIRC = (cx, cz, r, n = 24, a0 = 0) => { const p = []; for (let i = 0; i < n; i++) { const a = a0 + i / n * TAU; p.push([cx + Math.cos(a) * r, cz + Math.sin(a) * r]); } return p; };
const ARC = (cx, cz, r, a0, a1, n = 12) => { const p = []; for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; p.push([cx + Math.cos(a) * r, cz + Math.sin(a) * r]); } return p; };
function PLANK(p0, p1, w) {
  let dx = p1[0] - p0[0], dz = p1[1] - p0[1]; const l = Math.hypot(dx, dz); dx /= l; dz /= l;
  const nx = -dz * w / 2, nz = dx * w / 2;
  return [[p0[0] + nx, p0[1] + nz], [p1[0] + nx, p1[1] + nz], [p1[0] - nx, p1[1] - nz], [p0[0] - nx, p0[1] - nz]];
}
function offsetLine(p0, p1, off) {
  let dx = p1[0] - p0[0], dz = p1[1] - p0[1]; const l = Math.hypot(dx, dz);
  const nx = -dz / l * off, nz = dx / l * off;
  return [[p0[0] + nx, p0[1] + nz], [p1[0] + nx, p1[1] + nz]];
}
const LOOP = (pts, extra) => Object.assign({ pts, closed: true }, extra || {});
const LINE = (pts, extra) => Object.assign({ pts, closed: false }, extra || {});
function pointInPoly(x, z, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], zi = poly[i][1], xj = poly[j][0], zj = poly[j][1];
    if (((zi > z) !== (zj > z)) && (x < (xj - xi) * (z - zi) / (zj - zi) + xi)) inside = !inside;
  }
  return inside;
}
function polyBB(poly) {
  let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity;
  for (const p of poly) { a = Math.min(a, p[0]); b = Math.min(b, p[1]); c = Math.max(c, p[0]); d = Math.max(d, p[1]); }
  return [a, b, c, d];
}
const inBB = (x, z, bb, m = 0) => x >= bb[0] - m && x <= bb[2] + m && z >= bb[1] - m && z <= bb[3] + m;
function colorRamp(t) { // groen -> geel -> rood
  const c = new THREE.Color();
  if (t < 0.5) c.setRGB(lerp(0.18, 1, t * 2), lerp(0.8, 0.86, t * 2), 0.15);
  else c.setRGB(1, lerp(0.86, 0.2, (t - 0.5) * 2), lerp(0.15, 0.2, (t - 0.5) * 2));
  return c;
}

// ---------- Procedurele textures ----------
function vnoise(seed) {
  const N = 256, r = mulberry(seed), a = new Float32Array(N * N);
  for (let i = 0; i < a.length; i++) a[i] = r();
  return (x, y, P) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const x0 = ((xi % P) + P) % P, y0 = ((yi % P) + P) % P, x1 = (x0 + 1) % P, y1 = (y0 + 1) % P;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a00 = a[y0 * N + x0], a10 = a[y0 * N + x1], a01 = a[y1 * N + x0], a11 = a[y1 * N + x1];
    return (a00 + (a10 - a00) * u) * (1 - v) + (a01 + (a11 - a01) * u) * v;
  };
}
const NZ = vnoise(7);
function fbm(u, v, P = 8, oct = 4) { // naadloze fractale ruis, u,v in [0,1)
  let s = 0, amp = 0.5, f = 1, n = 0;
  for (let i = 0; i < oct; i++) { s += amp * NZ(u * P * f, v * P * f, P * f); n += amp; f *= 2; amp *= 0.5; }
  return s / n;
}
function pixTex(size, fn) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); const img = g.createImageData(size, size); const d = img.data;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const col = fn(x / size, y / size, x, y); const i = (y * size + x) * 4;
    d[i] = clamp(col[0], 0, 255); d[i + 1] = clamp(col[1], 0, 255); d[i + 2] = clamp(col[2], 0, 255); d[i + 3] = col[3] === undefined ? 255 : col[3];
  }
  g.putImageData(img, 0, 0); return c;
}
function toTex(canvas, srgb = true) {
  const t = new THREE.CanvasTexture(canvas); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4;
  if (srgb) t.encoding = THREE.sRGBEncoding; return t;
}
function drawCanvas(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return c; }
const TEX = {};
const TEXGEN = {
  grass: () => pixTex(256, (u, v) => { const n = fbm(u, v, 8), s = fbm(u, v, 64, 2); const b = 0.75 + n * 0.5 + (s - 0.5) * 0.5; return [60 * b, 150 * b, 50 * b]; }),
  grassDark: () => pixTex(256, (u, v) => { const n = fbm(u, v, 8), s = fbm(u, v, 64, 2); const b = 0.7 + n * 0.5 + (s - 0.5) * 0.4; return [52 * b, 62 * b, 44 * b]; }),
  meadow: () => pixTex(256, (u, v) => { const n = fbm(u, v, 4), s = fbm(u, v, 32, 2); const b = 0.7 + n * 0.6 + (s - 0.5) * 0.3; return [80 * b, 140 * b, 55 * b]; }),
  stone: () => drawCanvas(256, 256, (g) => {
    g.fillStyle = '#6e6a66'; g.fillRect(0, 0, 256, 256);
    const r = mulberry(3);
    for (let row = 0; row < 8; row++) for (let col = -1; col < 5; col++) {
      const x = col * 64 + (row % 2) * 32, y = row * 32; const l = 85 + r() * 50;
      g.fillStyle = `rgb(${l + 8},${l + 4},${l})`; g.fillRect(x + 2, y + 2, 60, 28);
      g.fillStyle = 'rgba(0,0,0,.12)'; g.fillRect(x + 2, y + 24, 60, 6);
    }
    const id = g.getImageData(0, 0, 256, 256); for (let i = 0; i < id.data.length; i += 4) { const k = (Math.random() - 0.5) * 18; id.data[i] += k; id.data[i + 1] += k; id.data[i + 2] += k; } g.putImageData(id, 0, 0);
  }),
  sandstone: () => drawCanvas(256, 256, (g) => {
    g.fillStyle = '#9c7a4a'; g.fillRect(0, 0, 256, 256); const r = mulberry(5);
    for (let row = 0; row < 4; row++) for (let col = -1; col < 3; col++) {
      const x = col * 128 + (row % 2) * 64, y = row * 64; const l = r() * 30;
      g.fillStyle = `rgb(${205 + l},${165 + l},${110 + l})`; g.fillRect(x + 3, y + 3, 122, 58);
    }
    const id = g.getImageData(0, 0, 256, 256); for (let i = 0; i < id.data.length; i += 4) { const k = (Math.random() - 0.5) * 22; id.data[i] += k; id.data[i + 1] += k; id.data[i + 2] += k; } g.putImageData(id, 0, 0);
  }),
  rock: () => pixTex(256, (u, v) => { const n = fbm(u, v, 6, 5); const c = Math.abs(fbm(u + 0.3, v, 4, 3) - 0.5) < 0.025 ? 0.4 : 1; const b = (0.45 + n * 0.7) * c; return [62 * b, 52 * b, 50 * b]; }),
  volcano: () => pixTex(256, (u, v) => { const n = fbm(u, v, 6, 5); const streak = Math.pow(Math.max(0, 1 - Math.abs(fbm(u, v * 0.25, 8, 3) - 0.5) * 18), 2); const b = 0.35 + n * 0.6; return [60 * b + 255 * streak, 45 * b + 120 * streak, 40 * b + 20 * streak]; }),
  wood: () => drawCanvas(256, 256, (g) => {

        if (r() < cfg.density) { const deg = cfg.scale[Math.floor(r() * cfg.scale.length)] + (r() < 0.3 ? 12 : 0); this.tone(cfg.root * Math.pow(2, deg / 12), spb * 2.5, { type: cfg.wave, vol: 0.07, delay: dt, dest: this.mus, filter: ['lowpass', 2200] }); }
        if (cfg.chirp && r() < 0.04) this.extra(cfg.chirp, dt);
        next += spb; beat++;
      }
    }, 100);
  },
  extra(kind, dt) {
    const d = { dest: this.mus, delay: dt };
    if (kind === 'bird') { for (let i = 0; i < 3; i++) this.tone(2500 + Math.random() * 800, 0.08, { ...d, delay: dt + i * 0.1, slide: 3500, vol: 0.05 }); }
    else if (kind === 'owl') { this.tone(420, 0.35, { ...d, slide: 380, vol: 0.06 }); this.tone(400, 0.5, { ...d, delay: dt + 0.45, slide: 340, vol: 0.06 }); }
    else if (kind === 'bubble') { this.tone(500 + Math.random() * 400, 0.12, { ...d, slide: 1400, vol: 0.05 }); }
    else if (kind === 'beep') { this.tone(1200 + Math.random() * 1200, 0.05, { ...d, type: 'square', vol: 0.025 }); }
    else if (kind === 'wind') { this.noise(2.5, { ...d, type: 'bandpass', freq: 400, slide: 900, vol: 0.06, attack: 1 }); }
    else if (kind === 'crackle') { this.noise(0.05, { ...d, type: 'highpass', freq: 3000, vol: 0.08 }); }
  },
  stopAmbient() {
    if (this.musTimer) { clearInterval(this.musTimer); this.musTimer = null; }
    if (this.amb) { try { this.amb.src.stop(); } catch (e) {} this.amb = null; }
  },
};

// ---------- Deeltjessysteem (stof, vonken, spetters, sneeuw, confetti...) ----------
class Particles {
  constructor(max, additive) {
    this.max = max; this.n = 0;
    this.pos = new Float32Array(max * 3); this.vel = new Float32Array(max * 3); this.col = new Float32Array(max * 3);
    this.size = new Float32Array(max); this.alpha = new Float32Array(max);
    this.life = new Float32Array(max); this.maxLife = new Float32Array(max); this.grav = new Float32Array(max);
    this.drag = new Float32Array(max); this.grow = new Float32Array(max); this.a0 = new Float32Array(max);
    const g = new THREE.BufferGeometry();
    this.aPos = new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage);
    this.aCol = new THREE.BufferAttribute(this.col, 3).setUsage(THREE.DynamicDrawUsage);
    this.aSize = new THREE.BufferAttribute(this.size, 1).setUsage(THREE.DynamicDrawUsage);
    this.aAlpha = new THREE.BufferAttribute(this.alpha, 1).setUsage(THREE.DynamicDrawUsage);
    g.setAttribute('position', this.aPos); g.setAttribute('pcolor', this.aCol); g.setAttribute('psize', this.aSize); g.setAttribute('palpha', this.aAlpha);
    g.setDrawRange(0, 0);
    this.mat = new THREE.ShaderMaterial({
      uniforms: { uScale: { value: 500 } },
      vertexShader: `attribute float psize; attribute float palpha; attribute vec3 pcolor; varying float vA; varying vec3 vC; uniform float uScale;
        void main(){ vA=palpha; vC=pcolor; vec4 mv=modelViewMatrix*vec4(position,1.0); gl_PointSize=psize*uScale/max(0.2,-mv.z); gl_Position=projectionMatrix*mv; }`,
      fragmentShader: `varying float vA; varying vec3 vC; void main(){ vec2 d=gl_PointCoord-0.5; float r=length(d); if(r>0.5) discard; gl_FragColor=vec4(vC, vA*smoothstep(0.5,0.12,r)); }`,
      transparent: true, depthWrite: false, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
    });
    this.points = new THREE.Points(g, this.mat); this.points.frustumCulled = false; this.points.renderOrder = 5;
    this.geo = g;
  }
  emit(x, y, z, vx, vy, vz, life, size, color, o = {}) {
    let i = this.n; if (i >= this.max) i = Math.floor(Math.random() * this.max); else this.n++;
    this.pos[i * 3] = x; this.pos[i * 3 + 1] = y; this.pos[i * 3 + 2] = z;
    this.vel[i * 3] = vx; this.vel[i * 3 + 1] = vy; this.vel[i * 3 + 2] = vz;
    this.col[i * 3] = color.r; this.col[i * 3 + 1] = color.g; this.col[i * 3 + 2] = color.b;
    this.size[i] = size; this.life[i] = life; this.maxLife[i] = life;
    this.grav[i] = o.grav || 0; this.drag[i] = o.drag || 0; this.grow[i] = o.grow || 0; this.a0[i] = o.alpha === undefined ? 1 : o.alpha; this.alpha[i] = this.a0[i];
  }
  burst(x, y, z, n, o) { // handige 'explosie' rond een punt
    const col = o.color instanceof THREE.Color ? o.color : new THREE.Color(o.color);
    for (let k = 0; k < n; k++) {
      const a = Math.random() * TAU, s = (o.speed || 2) * (0.3 + Math.random() * 0.7), up = (o.up || 1) * (0.4 + Math.random());
      const c = o.vary ? col.clone().offsetHSL((Math.random() - 0.5) * o.vary, 0, (Math.random() - 0.5) * 0.2) : col;
      this.emit(x + (Math.random() - 0.5) * (o.spread || 0), y, z + (Math.random() - 0.5) * (o.spread || 0), Math.cos(a) * s, up, Math.sin(a) * s,
        (o.life || 0.8) * (0.6 + Math.random() * 0.6), (o.size || 0.15) * (0.6 + Math.random() * 0.8), c, o);
    }
  }
  clear() { this.n = 0; this.geo.setDrawRange(0, 0); }
  update(dt) {
    let i = 0;
    while (i < this.n) {
      this.life[i] -= dt;
      if (this.life[i] <= 0) { // compact: laatste deeltje op deze plek zetten
        const l = --this.n;
        if (i !== l) {
          for (let k = 0; k < 3; k++) { this.pos[i * 3 + k] = this.pos[l * 3 + k]; this.vel[i * 3 + k] = this.vel[l * 3 + k]; this.col[i * 3 + k] = this.col[l * 3 + k]; }
          this.size[i] = this.size[l]; this.life[i] = this.life[l]; this.maxLife[i] = this.maxLife[l]; this.grav[i] = this.grav[l]; this.drag[i] = this.drag[l]; this.grow[i] = this.grow[l]; this.a0[i] = this.a0[l]; this.alpha[i] = this.alpha[l];
        }
        continue;
      }
      const d = 1 - this.drag[i] * dt;
      this.vel[i * 3] *= d; this.vel[i * 3 + 2] *= d; this.vel[i * 3 + 1] = this.vel[i * 3 + 1] * d - this.grav[i] * dt;
      this.pos[i * 3] += this.vel[i * 3] * dt; this.pos[i * 3 + 1] += this.vel[i * 3 + 1] * dt; this.pos[i * 3 + 2] += this.vel[i * 3 + 2] * dt;
      this.size[i] += this.grow[i] * dt;
      const f = this.life[i] / this.maxLife[i]; this.alpha[i] = this.a0[i] * Math.min(1, f * 3) * Math.min(1, (1 - f) * 12 + 0.2);
      i++;
    }
    this.geo.setDrawRange(0, this.n);
    this.aPos.needsUpdate = this.aCol.needsUpdate = this.aSize.needsUpdate = this.aAlpha.needsUpdate = true;
  }
}

// =====================================================================
//  HOLE-DATA
//  Elke hole: floor (speelbare vlakken; erbuiten = voidKind), walls (polylijnen),
//  zones (ondergronden/gevaren), posts (ronde obstakels), blocks (kleine balkjes),
//  movers (bewegende obstakels), special (het speciale element), theme (sfeer).
//  Coördinaten zijn [x, z] in meters; de bal start bij 'start', het gat ligt op 'hole'.
// =====================================================================
function islandWalls(cx, cz, r, gaps, extra) { // ronde eilandmuur met openingen (gaps: [hoek, halve breedte])
  gaps = gaps.map(g => [((g[0] % TAU) + TAU) % TAU, g[1]]).sort((a, b) => a[0] - b[0]);
  const out = [], n = gaps.length;
  for (let i = 0; i < n; i++) {
    const a0 = gaps[i][0] + gaps[i][1];
    const a1 = (i + 1 < n ? gaps[i + 1][0] : gaps[0][0] + TAU) - gaps[(i + 1) % n][1];
    out.push(LINE(ARC(cx, cz, r, a0, a1, Math.max(4, Math.round((a1 - a0) * r * 1.2))), extra));
  }
  return out;
}

        let a = 0;
        if (open) { const e = p - (T - OPEN); a = e < MV ? 1.7 * smooth(e / MV) : p > T - MV ? 1.7 * (1 - smooth((p - (T - MV)) / MV)) : 1.7; }
        else if (warn) a = 0.035 + Math.sin(t * 40 + D.cz) * 0.035; // rammelen
        D.leaves.forEach(L => { L.hinge.rotation.z = L.s < 0 ? -a : a; });
        D.crackM.opacity = warn ? 0.45 + 0.45 * Math.abs(Math.sin(t * 18)) : 0;
        D.glowM.opacity = open ? 0.3 + Math.sin(t * 6) * 0.08 : warn ? 0.12 : 0;
        const near = camDistTo(tmpV2.set(D.cx, 0, D.cz)) < 30;
        if (warn && !D.prevWarn && near) SND.creak();
        if (open && !D.prevOpen) { if (near) { SND.clank(); SND.creak(); } fx.burst(D.cx, 0.1, D.cz, 12, { color: '#5a4a3a', speed: 1.4, up: 0.8, life: 0.7, size: 0.25, grow: 0.5, alpha: 0.5, spread: 1.4 }); }
        if (!open && D.prevOpen && near) SND.bonk();
        D.prevWarn = warn; D.prevOpen = open;
        if (open && Math.random() < dt * 10 * Q.fx) fxAdd.emit(D.cx + (Math.random() - 0.5) * 2, -0.8, D.cz + (Math.random() - 0.5) * 1.6, 0, 1.3, 0, 1.0, 0.12, new THREE.Color('#7dff9a'), { alpha: 0.6 });
      }
    };
    return o;
  },

  // ---------- Krachtveld (Ruimte): energiewand tussen twee zenders ----------
  // d.a, d.b = uiteinden. mode 'timer': aan/uit volgens d.times = [aan, uit] (+ d.phase); het veld flikkert
  // d.warn seconden voor het aangaat. mode 'core': aan tot je de energiekern (d.core = [x, z]) raakt; dan valt
  // het uit en blijft het uit tot de volgende beurt. Het veld gaat nooit aan terwijl de bal in de doorgang
  // (d.sweep = [x0, z0, x1, z1]) ligt, dus de bal kan er nooit in vast komen te zitten.
  spaceField(d) {
    const o = { group: new THREE.Group(), s: 1, down: false, react: 0, flash: 0, prevOn: true };
    const col = new THREE.Color(d.color || '#00e5ff');
    const fp = prim(0.13, { e: 0.95, kick: 2.5, kind: 'metal', owner: o }); setSeg(fp, d.a[0], d.a[1], d.b[0], d.b[1]);
    o.prims = [fp];
    let cp = null;
    if (d.mode === 'core') { cp = prim(0.36, { e: 0.8, kind: 'metal', owner: o }); setCirc(cp, d.core[0], d.core[1]); o.prims.push(cp); }
    const sw = d.sweep, inSweep = b => b.x > sw[0] && b.x < sw[2] && b.z > sw[1] && b.z < sw[3];
    const T = d.times ? d.times[0] + d.times[1] : 1, WARN = d.warn || 0.8;
    const phase = t => (((t + (d.phase || 0)) % T) + T) % T;
    const want = t => d.mode === 'core' ? (o.down ? 0 : 1) : (phase(t) < d.times[0] ? 1 : 0);
    o.reset = () => { o.down = false; }; // nieuwe beurt: kern weer heel, veld weer aan
    o.update = (t, h, b) => {
      const w = want(t), busy = (b.state === 'rest' || b.state === 'moving') && inSweep(b);
      if (w > o.s && !busy) o.s = Math.min(1, o.s + h / 0.25);
      else if (w < o.s) o.s = Math.max(0, o.s - h / 0.25);
      fp.on = o.s > 0.5;
    };
    // energieveld: scrollende scanlijnen
    const L = Math.hypot(d.b[0] - d.a[0], d.b[1] - d.a[1]);
    const ftex = toTex(drawCanvas(128, 64, (g) => {
      const gr = g.createLinearGradient(0, 0, 0, 64); gr.addColorStop(0, 'rgba(255,255,255,0.25)'); gr.addColorStop(0.5, 'rgba(255,255,255,0.5)'); gr.addColorStop(1, 'rgba(255,255,255,1)');
      g.fillStyle = gr; g.fillRect(0, 0, 128, 64);
      g.strokeStyle = 'rgba(255,255,255,0.9)'; g.lineWidth = 2; for (let y = 4; y < 64; y += 10) { g.beginPath(); g.moveTo(0, y); g.lineTo(128, y); g.stroke(); }
      g.lineWidth = 1; for (let x = 0; x < 128; x += 16) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 16, 64); g.stroke(); }
    }));
    ftex.repeat.set(Math.max(1, L / 1.2), 1);
    const fm = new THREE.MeshBasicMaterial({ map: ftex, color: col, transparent: true, opacity: 0.6, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending });
    const plane = mesh(new THREE.PlaneGeometry(L, 0.95), fm, o.group, (d.a[0] + d.b[0]) / 2, 0.5, (d.a[1] + d.b[1]) / 2, false);
    plane.rotation.y = -Math.atan2(d.b[1] - d.a[1], d.b[0] - d.a[0]); plane.renderOrder = 4;
    const lineM = new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.9 });
    const line = mesh(BOX(L, 0.04, 0.06), lineM, o.group, (d.a[0] + d.b[0]) / 2, 0.03, (d.a[1] + d.b[1]) / 2, false); line.rotation.y = plane.rotation.y;
    // zenders aan beide kanten
    const emM = new THREE.MeshStandardMaterial({ color: '#202028', emissive: col, emissiveIntensity: 1.5 });
    const pyl = M('#c8d0dc', { metalness: 0.8, roughness: 0.3 });
    for (const p of [d.a, d.b]) {
      mesh(CYL(0.15, 0.2, 1.05, 12), pyl, o.group, p[0], 0.52, p[1]);
      mesh(SPH(0.13, 12, 8), emM, o.group, p[0], 1.1, p[1], false);
      const rg = mesh(new THREE.TorusGeometry(0.2, 0.035, 6, 16), emM, o.group, p[0], 0.75, p[1], false); rg.rotation.x = Math.PI / 2;
    }
    // energiekern op een sokkel
    let crystal = null, coreM = null, cage = null;
    if (cp) {
      const cg = new THREE.Group(); cg.position.set(d.core[0], 0, d.core[1]); o.group.add(cg);
      mesh(CYL(0.36, 0.44, 0.32, 16), M('#3a4050', { metalness: 0.8, roughness: 0.35 }), cg, 0, 0.16, 0);
      coreM = new THREE.MeshStandardMaterial({ color: '#ffffff', emissive: col, emissiveIntensity: 1.6, roughness: 0.2, metalness: 0.3 });
      crystal = mesh(new THREE.OctahedronGeometry(0.3, 0), coreM, cg, 0, 0.78, 0); crystal.scale.y = 1.4;
      cage = new THREE.Group(); cage.position.y = 0.78; cg.add(cage);
      for (let k = 0; k < 2; k++) { const r = mesh(new THREE.TorusGeometry(0.42, 0.025, 6, 24), pyl, cage, 0, 0, 0, false); r.rotation.x = k ? Math.PI / 2 : 0; }
    }
    const offCol = new THREE.Color('#ff3030');
    o.visual = (t, dt) => {
      o.react = Math.max(0, o.react - dt); o.flash = Math.max(0, o.flash - dt * 4);
      const w = want(t), warn = d.mode !== 'core' && !w && phase(t) > T - WARN;
      const flick = warn ? (Math.sin(t * 45) > 0 ? 0.35 : 0.05) : 0;
      ftex.offset.set(t * 0.4, -t * 0.8);
      fm.opacity = Math.max(o.s * (0.85 + Math.sin(t * 9) * 0.08), flick) + o.flash * 0.4;
      plane.visible = fm.opacity > 0.01; lineM.opacity = 0.25 + o.s * 0.7;
      emM.emissiveIntensity = 0.3 + o.s * 1.3 + flick * 2;
      if (crystal) {
        crystal.rotation.y = t * (o.down ? 0.3 : 1.6); crystal.position.y = 0.78 + Math.sin(t * 2.5) * 0.06; cage.rotation.y = -t * 0.8; cage.rotation.z = Math.sin(t) * 0.3;
        coreM.emissive.copy(o.down ? offCol : col); coreM.emissiveIntensity = o.down ? 0.25 + o.react * 2 : 1.4 + Math.sin(t * 5) * 0.3;
      }
      const on = o.s > 0.5;
      if (on !== o.prevOn && camDistTo(plane.position) < 30) { if (on) SND.tone(220, 0.35, { type: 'sawtooth', slide: 660, vol: 0.05, filter: ['lowpass', 1800] }); else SND.tone(660, 0.4, { type: 'sawtooth', slide: 110, vol: 0.05, filter: ['lowpass', 1800] }); }
      o.prevOn = on;
      if (on && Math.random() < dt * 8 * Q.fx) { const u = Math.random(); fxAdd.emit(lerp(d.a[0], d.b[0], u), 0.1 + Math.random() * 0.8, lerp(d.a[1], d.b[1], u), 0, 0.3, 0, 0.6, 0.08, col, { alpha: 0.8 }); }
    };
    o.onHit = (p, imp) => {
      if (p === fp) { if (o.flash < 0.5) { o.flash = 1; SND.tone(1400, 0.12, { type: 'square', slide: 500, vol: 0.05 }); fxAdd.burst(ball.x, 0.4, ball.z, 10, { color: col, speed: 2.5, up: 1, life: 0.35, size: 0.1 }); } return; }
      if (p === cp && !o.down) {
        o.down = true; o.react = 1; SND.ding(); SND.tone(900, 0.7, { type: 'sawtooth', slide: 80, vol: 0.06, filter: ['lowpass', 2000] });
        fxAdd.burst(d.core[0], 0.8, d.core[1], 30, { color: col, speed: 3.5, up: 2.5, life: 0.8, size: 0.14 });
      }
    };
    return o;
  },

  // ----- nieuw (Weide, Vulkaan, Kasteel) -----
  // (bewegende obstakels met de interface van MOVERS; als special krijgen ze een naam en uitleg in de instructies)
  // ---------- Hollandse molen met doorrit (Weide) ----------
  // De wieken draaien (w > 0, tegen de klok in gezien van voren) in het xy-vlak op z = hub[1] en vegen
  // vlak voor de doorrit over de grond. tower = midden van de romp, r = straal van de stenen voet,
  // pass = breedte van de doorrit (langs z), sail = breedte van het zeil. hubY ~ len + 0.25: de tippen
  // scheren net boven de grond; zolang de onderrand van een zeil lager dan de bal is, blokkeert die rand.
  // De botsmuren van de voet staan als gewone muren in de hole-data; hier alleen wieken + model.
  weideMolen(d) {
    const o = { group: new THREE.Group(), prims: [] };
    for (let i = 0; i < d.blades; i++) o.prims.push(prim(0.16, { e: 0.7, kick: 3, kind: 'wood' }));
    const g = o.group, T = d.tower, R = d.r, pw = d.pass || 1.8, hp = 1.5, bodyH = d.hubY - hp - 0.45;
    const brick = M('#a65a42', { map: tex('stone'), roughness: 0.92 }), white = M('#f4f1ea', { roughness: 0.6 });
    const thatch = M('#857057', { map: tex('wood'), roughness: 1 }), capM = M('#3d4a3c', { map: tex('wood'), roughness: 0.8 });
    const occ = m => { m.material = m.material.clone(); m.userData.occ = true; H.occluders.push(m); return m; }; // eigen materiaal: vervaagt los
    // stenen voet: twee halve cilinders naast de doorrit (de doorrit zelf blijft open)
    const a0 = Math.asin(Math.min(0.95, (pw / 2 + 0.1) / R));
    for (const th0 of [a0, Math.PI + a0]) occ(mesh(scaleUV(new THREE.CylinderGeometry(R, R + 0.12, hp, 18, 1, false, th0, Math.PI - 2 * a0), 3, 0.6), brick, g, T[0], hp / 2, T[1], true, true));
    const lintel = occ(mesh(scaleUV(BOX(pw + 0.5, 0.3, R * 2 * Math.cos(a0) + 0.1), 1, 1), brick, g, T[0], hp + 0.1, T[1], true, true));
    mesh(BOX(pw, 0.04, R * 2 * Math.cos(a0)), M('#4a3524', { map: tex('wood') }), g, T[0], hp - 0.07, T[1], false); // balkenplafond
    for (const s of [-1, 1]) mesh(new THREE.TorusGeometry(pw / 2, 0.09, 6, 16, Math.PI), white, g, T[0], hp - pw / 2 + 0.05, T[1] + s * (R * Math.cos(a0) + 0.02), false); // witte boog rond de doorrit
    // achtkantige rieten romp, witte band, stelling en kap
    const body = occ(mesh(scaleUV(new THREE.CylinderGeometry(R * 0.6, R * 0.9, bodyH, 8), 4, 3), thatch, g, T[0], hp + bodyH / 2, T[1], true, true));
    body.rotation.y = Math.PI / 8;
    mesh(new THREE.CylinderGeometry(R * 0.92, R * 0.94, 0.22, 8), white, g, T[0], hp + 0.1, T[1]).rotation.y = Math.PI / 8;
    const stage = new THREE.Group(); stage.position.set(T[0], hp + bodyH * 0.38, T[1]); g.add(stage);
    const sr = R * (0.9 - 0.3 * 0.38) + 0.45;
    mesh(new THREE.CylinderGeometry(sr, sr, 0.08, 20), M('#6d4c2f', { map: tex('wood') }), stage, 0, 0, 0);
    for (let k = 0; k < 16; k++) { const a = (k + 0.5) / 16 * TAU; mesh(BOX(0.05, 0.45, 0.05), white, stage, Math.sin(a) * sr, 0.25, Math.cos(a) * sr, false); }
    mesh(new THREE.TorusGeometry(sr, 0.03, 4, 40), white, stage, 0, 0.47, 0, false).rotation.x = Math.PI / 2;
    const capY = hp + bodyH;
    const cap = occ(mesh(new THREE.CylinderGeometry(R * 0.68, R * 0.68, R * 1.75, 14, 1, false, -Math.PI / 2, Math.PI), capM, g, T[0], capY, T[1], true));
    cap.rotation.x = -Math.PI / 2; // halve cilinder met de bolle kant boven, as langs z
    for (let k = 0; k < 4; k++) { const f = 0.22 + k * 0.17, rr = R * (0.9 - 0.3 * f) + 0.03, a = 0.6 + k * 1.7; mesh(BOX(0.42, 0.55, 0.05), new THREE.MeshBasicMaterial({ color: '#ffd27a' }), g, T[0] + Math.cos(a) * rr, hp + bodyH * f, T[1] + Math.sin(a) * rr, false).rotation.y = Math.PI / 2 - a; }
    // as + wieken (met hekwerk en zeil)
    const hub = new THREE.Group(); hub.position.set(d.hub[0], d.hubY, d.hub[1]); g.add(hub);
    orientCyl(mesh(CYL(0.16, 0.2, 1, 10), M('#3a2a1c'), g, 0, 0, 0), new THREE.Vector3(d.hub[0], d.hubY, d.hub[1] + 0.25), new THREE.Vector3(T[0], capY, T[1]));
    mesh(SPH(0.32, 12, 10), M('#2a201a'), hub, 0, 0, 0.18);
    const wood = M('#5a3e28', { map: tex('wood') }), sailM = M('#f6efe0', { side: THREE.DoubleSide, roughness: 0.95, transparent: true, opacity: 0.92 });
    const parts = [placed(BOX(0.16, d.len, 0.16), 0, -d.len / 2, 0.22)];
    const lw = d.sail || Math.max(0.6, d.len * 0.2), l0 = d.len * 0.2;
    parts.push(placed(BOX(0.07, d.len - l0, 0.07), -lw, -(l0 + d.len) / 2, 0.24));
    for (let y = l0; y <= d.len + 0.01; y += 0.42) parts.push(placed(BOX(lw + 0.08, 0.05, 0.05), -lw / 2, -y, 0.26));
    const bladeGeo = mergeGeos(parts);
    for (let i = 0; i < d.blades; i++) {
      const b = new THREE.Group(); b.rotation.z = i / d.blades * TAU; hub.add(b);
      occ(mesh(bladeGeo.clone(), wood, b, 0, 0, 0, true));
      const cloth = occ(mesh(new THREE.PlaneGeometry(lw * 0.92, (d.len - l0) * 0.82), sailM, b, -lw / 2, -(l0 + d.len) / 2 - (d.len - l0) * 0.08, 0.2, true));
      cloth.renderOrder = 1;
    }
    bladeGeo.dispose();
    let ang = 0;
    o.update = (t) => {
      ang = (d.phase || 0) + d.w * t;
      for (let i = 0; i < d.blades; i++) {
        const phi = ang + i / d.blades * TAU, sn = Math.sin(phi), cs = Math.cos(phi), p = o.prims[i];
        // onderrand van het zeil: van de tip (A) naar de achterste hoek (B); alleen het deel onder balhoogte telt
        const ax = d.hub[0] + sn * d.len, ay = d.hubY - cs * d.len, bx = ax - cs * lw, by = ay - sn * lw, lim = 0.42;
        if (cs <= 0.3 || (ay >= lim && by >= lim)) { p.on = false; setCirc(p, ax, d.hub[1]); continue; }
        let x0 = ax, x1 = bx;
        if (ay >= lim) x0 = ax + (bx - ax) * (ay - lim) / (ay - by); else if (by >= lim) x1 = ax + (bx - ax) * (ay - lim) / (ay - by);
        p.on = true; setSeg(p, x0, d.hub[1], x1, d.hub[1]);
      }
    };
    let prevLow = false;
    o.visual = (t, dt) => {
      hub.rotation.z = ang;
      const low = o.prims.some(p => p.on); // zoef van een wiek die vlak over de grond scheert
      if (low && !prevLow && camDistTo(hub.position) < 22) SND.noise(0.35, { type: 'bandpass', freq: 500, slide: 180, q: 1.5, vol: 0.12, attack: 0.1 });
      prevLow = low;
    };
    return o;
  },

  // ---------- Hollandse ophaalbrug (Weide): de ophaalbrug van het kasteel met een witte 'galg' en balans ----------
  // Zelfde parameters als drawbridge (mode 'period' of 'trigger'); de balans boven de brug beweegt mee.
  weideOphaalbrug(d) {
    const o = MOVERS.drawbridge(d);
    o.group.children.slice(1).forEach(c => { c.visible = false; }); // de kasteelkettingen niet tonen
    const piv = o.group.children[0], W = d.x2 - d.x1, cx = (d.x1 + d.x2) / 2, Hp = 3.3;
    const white = M('#f7f5ef', { roughness: 0.55 }), black = M('#222222', { roughness: 0.6 });
    // witte leuningen op het brugdek (draaien mee)
    for (const s of [-1, 1]) {
      mesh(BOX(0.08, 0.08, d.len - 0.2), white, piv, s * (W / 2 - 0.06), 0.42, d.len / 2, false);
      for (let k = 0; k <= 4; k++) mesh(BOX(0.06, 0.4, 0.06), white, piv, s * (W / 2 - 0.06), 0.21, 0.15 + k * (d.len - 0.3) / 4, false);
    }
    // galg: twee palen met een dwarsbalk, naast het scharnier
    const posts = [];
    for (const s of [-1, 1]) {
      const px = cx + s * (W / 2 + 0.3);
      mesh(BOX(0.28, Hp + 0.4, 0.28), white, o.group, px, (Hp + 0.4) / 2 - 0.1, d.hinge, true);
      mesh(BOX(0.3, 0.3, 0.3), black, o.group, px, 0.05, d.hinge, false);
      const pp = prim(0.18, { e: 0.7, kind: 'wood' }); setCirc(pp, px, d.hinge); posts.push(pp);
    }
    mesh(BOX(W + 0.9, 0.24, 0.26), white, o.group, cx, Hp + 0.35, d.hinge, true);
    // balans: draait om de top van de galg, evenwijdig aan het dek (parallellogram: de trekstangen blijven verticaal)
    const bal = new THREE.Group(); bal.position.set(cx, Hp, d.hinge); o.group.add(bal);
    for (const s of [-1, 1]) {
      mesh(BOX(0.16, 0.2, d.len * 1.45), white, bal, s * (W / 2 + 0.1), 0, d.len * 0.5 - d.len * 0.45 * 0.5, true);
      for (let k = 0; k < 6; k++) mesh(BOX(0.17, 0.21, 0.12), black, bal, s * (W / 2 + 0.1), 0, -d.len * 0.4 + k * 0.32, false);
    }
    for (const z of [d.len * 0.35, d.len * 0.7]) mesh(BOX(W + 0.3, 0.1, 0.1), white, bal, 0, 0.05, z, false);
    mesh(BOX(W + 0.5, 0.45, 0.7), black, bal, 0, -0.1, -d.len * 0.38, true); // contragewicht
    const rods = [-1, 1].map(s => mesh(CYL(0.035, 0.035, 1, 6), M('#555', { metalness: 0.7, roughness: 0.4 }), o.group, 0, 0, 0, false));
    // de leuningen houden de bal op het dek zolang de brug ligt
    const rails = [-1, 1].map(s => { const rp = prim(0.06, { e: 0.6, kind: 'wood' }); const x = cx + s * (W / 2 - 0.06); setSeg(rp, x, d.hinge + 0.1, x, d.hinge + d.len - 0.1); return rp; });
    const upd = o.update;
    o.update = (t, h, b) => { upd(t, h, b); rails.forEach(rp => { rp.on = o.angle < 0.3; }); };
    o.prims.push(...posts, ...rails);
    const vis = o.visual;
    o.visual = (t, dt) => {
      vis(t, dt);
      bal.rotation.x = -o.angle;
      const ez = d.hinge + Math.cos(o.angle) * (d.len - 0.15), ey = Math.sin(o.angle) * (d.len - 0.15);
      rods.forEach((r, i) => { const x = cx + (i ? 1 : -1) * (W / 2 + 0.1); orientCyl(r, new THREE.Vector3(x, ey + 0.1, ez), new THREE.Vector3(x, Hp + ey, ez)); });
    };
    return o;
  },

  // ---------- Schuifdeur van de schuur (Weide): schuifmuur met het uiterlijk van een rode staldeur op een rail ----------
  weideSchuurdeur(d) {
    const inner = MOVERS.slider(d);
    disposeTree(inner.group); inner.group.clear(); // het spookhuis-uiterlijk vervangen
    const o = { group: new THREE.Group(), prims: inner.prims, update: inner.update, visual: inner.visual };
    o.group.add(inner.group);
    const dx = d.b[0] - d.a[0], dz = d.b[1] - d.a[1], L = Math.hypot(dx, dz), rot = -Math.atan2(dz, dx);
    const door = new THREE.Group(); door.rotation.y = rot; inner.group.add(door);
    const red = M('#b3342b', { map: tex('wood'), roughness: 0.85 }), white = M('#f5f2ea', { roughness: 0.7 });
    mesh(BOX(L, 1.45, 0.16), red, door, 0, 0.72, 0, true, true);
    for (const s of [-1, 1]) {
      mesh(BOX(L, 0.1, 0.18), white, door, 0, 0.72 + s * 0.68, 0, false);
      mesh(BOX(0.1, 1.45, 0.18), white, door, s * (L / 2 - 0.05), 0.72, 0, false);
      const br = mesh(BOX(Math.hypot(L - 0.2, 1.25), 0.09, 0.18), white, door, 0, 0.72, 0, false); br.rotation.z = s * Math.atan2(1.25, L - 0.2);
    }
    for (const s of [-1, 1]) mesh(SPH(0.07, 8, 6), M('#333', { metalness: 0.7 }), door, s * L * 0.3, 1.5, 0.05, false); // looprolletjes
    // vaste rail boven de deuropening tot over de open stand

  // ---------- Sneeuwbal (IJs): een reuzensneeuwbal die telkens van de gletsjer rolt ----------

function spacePlatforms(ctx, heroes, small, rnd) {
  const bb = H.bounds, cx = H.center[0], cz = H.center[1];
  const rockM = M('#5a5560', { map: tex('rock'), flatShading: true, roughness: 0.95 }), plateM = M('#c8d0dc', { metalness: 0.6, roughness: 0.4 });
  const floaters = heroes.filter(h => /ufo/.test(h.e.name)), grounded = heroes.filter(h => !/ufo/.test(h.e.name));
  let n = 0;
  for (const h of grounded) {
    if (n >= 4) break;
    const r = Math.max(3, (h.e.footprint || 2) + 1.8);
    let p = null;
    for (let k = 0; k < 80 && !p; k++) { const a = rnd() * TAU, d = 9 + rnd() * 22; const x = cx + Math.cos(a) * (d + (bb[2] - bb[0]) / 2), z = cz + Math.sin(a) * (d + (bb[3] - bb[1]) / 2); if (courseDist(x, z) > r + 4 && occFree(x, z, r + 2)) p = [x, z]; }
    if (!p) continue; n++;
    const y = -1.2 - rnd() * 2.5, grp = new THREE.Group(); grp.position.set(p[0], y, p[1]); holeGroup.add(grp); H.occ.push([p[0], p[1], r + 2]);
    const rock = mesh(new THREE.CylinderGeometry(r, r * 0.35, 2.6, 9, 2), rockM, grp, 0, -1.3, 0, false, true); rock.rotation.y = rnd() * 3;
    mesh(new THREE.CylinderGeometry(r * 0.97, r * 0.97, 0.12, 24), plateM, grp, 0, 0.02, 0, false, true);
    placeModel(h.key, 0, 0.08, 0, Math.atan2(cx - p[0], cz - p[1]), 1, grp, true);
    for (let k = 0; k < 3 && small.length; k++) { const m = small[Math.floor(rnd() * small.length)], a = rnd() * TAU, d = r * (0.62 + rnd() * 0.25); placeModel(m.key, Math.cos(a) * d, 0.08, Math.sin(a) * d, rnd() * TAU, 0.8, grp, false); }
    const ph = rnd() * 6; H.updaters.push(t => { grp.position.y = y + Math.sin(t * 0.5 + ph) * 0.25; });
  }
  for (const h of floaters) { const a = rnd() * TAU, d = 14 + rnd() * 10; const g = placeModel(h.key, cx + Math.cos(a) * d, 9, cz + Math.sin(a) * d, 0, 1, holeGroup, false); if (g) H.updaters.push(t => { g.position.y = 8 + Math.sin(t * 0.8) * 0.8; g.rotation.y = t * 0.4; }); }
}

  // ---------- Finale ----------

    const AR = S.arch || [ctx.def.hole[0] - 4, ctx.def.hole[0] + 4, H.bounds[1] - 0.6], amx = (AR[0] + AR[1]) / 2, aw = AR[1] - AR[0];
    for (const x of [AR[0], AR[1]]) mesh(CYL(0.35, 0.4, 5, 12), gold, ctx.g, x, 2.5, AR[2]);
    mesh(BOX(aw + 1.1, 1.1, 0.4), gold, ctx.g, amx, 5.2, AR[2]);
    mesh(new THREE.PlaneGeometry(aw - 0.3, 0.9), new THREE.MeshBasicMaterial({ map: textTex('FINISH', { bg: '#7a1fa2', color: '#ffffff', size: 54, w: 512, h: 64 }) }), ctx.g, amx, 5.2, AR[2] + 0.21, false);
    // poorthuis waarin het hek wegschuift

    // set.arches = stenen poortbogen [x, y, z, breedte] (bv. boven een ophaalbrug tussen twee torens)

    // set.channels = [[x0, zTop, x1, zBottom], ...]: geulen met ijskoud water boven de lava (ijsschotsen)
    for (const c of S.channels || []) {
      const w = c[2] - c[0], d = c[1] - c[3];
      const cw = new THREE.PlaneGeometry(w, d, Math.ceil(w * 2), Math.ceil(d * 2)); cw.rotateX(-Math.PI / 2); scaleUV(cw, 2);
      mesh(cw, M('#4a7aa0', { map: tex('water'), roughness: 0.05, metalness: 0.3, transparent: true, opacity: 0.95 }), ctx.g, (c[0] + c[2]) / 2, -0.28, (c[1] + c[3]) / 2, false, true);
      mesh(BOX(w + 0.6, 1.2, d + 0.6), M('#2a3a4a', { map: tex('rock') }), ctx.g, (c[0] + c[2]) / 2, -0.95, (c[1] + c[3]) / 2, false, true); // bedding onder het water

      <li>Water, lava, kwikzand en afgronden kosten 1 strafslag; de bal gaat terug naar waar je sloeg.</li>
      <li>Te snel over het gat? Dan rolt de bal eroverheen of springt hij eruit.</li>
      <li>Na 10 slagen kies je: stoppen (je score wordt je slagen + 2) of doorspelen zonder limiet. Met 2 tot 4 spelers speel je om de beurt elke hole uit.</li>
      <li>Bewegende elementen volgen een vast ritme. Kijk eerst even, dan kun je ze timen of gebruiken.</li></ul>
    <h3>Speciale elementen</h3>${els}
    <div style="text-align:center;margin-top:12px"><button class="big" id="bInstrClose">SLUITEN</button></div>`;
  $('bInstrClose').onclick = hideInstr;
  instrWasPaused = G.paused; if (G.state !== 'menu' && G.state !== 'final') { G.paused = true; G.aim = null; G.charging = false; }
  $('instrScr').classList.remove('hidden');
}
function hideInstr() { $('instrScr').classList.add('hidden'); if (G.state !== 'menu' && G.state !== 'final') G.paused = instrWasPaused; }
function applyQuality() {
  Q.fx = Q.high ? 1 : 0.5;
  try { localStorage.setItem('minigolf3d_q', Q.high ? 'high' : 'low'); } catch (e) { /* niet opslaan */ }
  renderer.setPixelRatio(Q.high ? Math.min(window.devicePixelRatio || 1, 2) : 1);
  const ms = Q.high ? 2048 : 1024; sun.shadow.mapSize.set(ms, ms); if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
  window.dispatchEvent(new Event('resize'));
  ['bQual', 'bQual2'].forEach(id => $(id).textContent = '⚙ Kwaliteit: ' + (Q.high ? 'hoog' : 'laag'));
  if (G.state === 'menu' && H) { buildHole(0); applyEnvMaps(); resetBall(HOLES[0].start[0], HOLES[0].start[1]); } // dichtheid van de omgeving direct zichtbaar
}
function setPaused(v) {
  if (G.state === 'menu' || G.state === 'final') return;
  G.paused = v; $('pauseScr').classList.toggle('hidden', !v); $('bPause').classList.toggle('on', v);
  if (v) { G.aim = null; G.charging = false; }
}
function toggleOverview() { if (G.state !== 'play' && G.state !== 'turnover') return; Cam.ovTarget = Cam.ovTarget > 0.5 ? 0 : 1; $('bOverview').classList.toggle('on', Cam.ovTarget > 0.5); G.aim = null; }
function toggleSound() { SND.init(); SND.setMuted(!SND.muted); $('bSound').textContent = SND.muted ? '🔇' : '🔊'; }

document.querySelectorAll('#playerSel button').forEach(b => b.onclick = () => { document.querySelectorAll('#playerSel button').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); G.nPlayers = +b.dataset.n; SND.init(); });
$('bStart').onclick = () => startGame(G.nPlayers, 'all');
$('bGoOn').onclick = () => chooseMax(true); $('bStop').onclick = () => chooseMax(false);
$('bPick').onclick = () => { SND.init(); showPick(); };
$('bPickBack').onclick = () => { $('pickScr').classList.add('hidden'); $('menu').classList.remove('hidden'); };
$('bInstr').onclick = showInstr; $('bInstr2').onclick = showInstr; $('bHelp').onclick = showInstr;
$('bQual').onclick = $('bQual2').onclick = () => { Q.high = !Q.high; applyQuality(); };
$('bRestart').onclick = () => { if (G.state === 'choice') { $('choiceScr').classList.add('hidden'); G.state = 'play'; } if (G.state !== 'play' || ball.state === 'sink') return; P().strokes = 0; P().cont = false; ball.safeX = HOLES[G.hole].start[0]; ball.safeZ = HOLES[G.hole].start[1]; resetBall(HOLES[G.hole].start[0], HOLES[G.hole].start[1]); ball.lastX = ball.x; ball.lastZ = ball.z; Cam.yaw = yawToward(ball.x, ball.z, HOLES[G.hole].aim[0], HOLES[G.hole].aim[1]); updateHUD(); toast('Hole herstart'); };
$('bOverview').onclick = toggleOverview;
$('bSound').onclick = toggleSound;
$('bPause').onclick = () => setPaused(!G.paused);
$('bResume').onclick = () => setPaused(false);
$('bQuit').onclick = () => toMenu();

// =====================================================================
//  INVOER: muis/touch (katapult), toetsenbord
// =====================================================================
const canvas = renderer.domElement;
const pointers = new Map(); let pinchD = 0;
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hitP = new THREE.Vector3();
function ballScreen() { tmpV.set(ball.x, ball.y, ball.z).project(camera); return { x: (tmpV.x + 1) / 2 * window.innerWidth, y: (1 - tmpV.y) / 2 * window.innerHeight }; }
function groundPoint(px, py) {
  ndc.set(px / window.innerWidth * 2 - 1, -(py / window.innerHeight) * 2 + 1); raycaster.setFromCamera(ndc, camera);
  plane.constant = -ball.y; return raycaster.ray.intersectPlane(plane, hitP) ? hitP : null;
}
canvas.addEventListener('pointerdown', e => {
  SND.init(); canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinchD = Math.hypot(a.x - b.x, a.y - b.y); G.aim = null; G.rot = null; return; }
  if (G.state !== 'play' && G.state !== 'turnover') return;
  const bs = ballScreen(); const near = Math.hypot(e.clientX - bs.x, e.clientY - bs.y) < Math.max(70, Math.min(window.innerWidth, window.innerHeight) * 0.12);
  if (e.button === 0 && near && canShoot()) { G.aim = { id: e.pointerId, dir: null, power: 0 }; }
  else G.rot = { id: e.pointerId, x: e.clientX, y: e.clientY };
});
canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); if (pinchD > 0) Cam.dist = clamp(Cam.dist * pinchD / d, 3, 26); pinchD = d; return; }
  if (G.aim && G.aim.id === e.pointerId) {
    const bs = ballScreen(); const pd = Math.hypot(e.clientX - bs.x, e.clientY - bs.y);
    G.aim.power = clamp(pd / (Math.min(window.innerWidth, window.innerHeight) * 0.3), 0, 1);
    const gp = groundPoint(e.clientX, e.clientY);
    if (gp) { const dx = ball.x - gp.x, dz = ball.z - gp.z; if (Math.hypot(dx, dz) > 0.05) G.aim.dir = [dx, dz]; }
    else { // boven de horizon: schermvector omzetten met de camerahoek
      const sx = e.clientX - bs.x, sy = e.clientY - bs.y, c = Math.cos(Cam.yaw), s = Math.sin(Cam.yaw);
      G.aim.dir = [-c * sx - s * sy, s * sx - c * sy];
    }
  } else if (G.rot && G.rot.id === e.pointerId) {
    Cam.yaw -= (e.clientX - G.rot.x) * 0.006; Cam.pitch = clamp(Cam.pitch + (e.clientY - G.rot.y) * 0.004, 0.18, 1.35);
    G.rot.x = e.clientX; G.rot.y = e.clientY;
  }
});
function endPointer(e) {
  pointers.delete(e.pointerId); if (pointers.size < 2) pinchD = 0;
  if (G.aim && G.aim.id === e.pointerId) { const a = G.aim; G.aim = null; if (a.dir && a.power > 0.04) shoot(a.dir[0], a.dir[1], a.power); }
  if (G.rot && G.rot.id === e.pointerId) G.rot = null;
}
canvas.addEventListener('pointerup', endPointer); canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => { e.preventDefault(); Cam.dist = clamp(Cam.dist * (e.deltaY > 0 ? 1.1 : 0.9), 3, 26); }, { passive: false });
const keys = {};
window.addEventListener('keydown', e => {
  if (e.repeat && e.code === 'Space') { e.preventDefault(); return; }
  keys[e.code] = true; SND.init();
  if (!$('instrScr').classList.contains('hidden')) { if (e.code === 'Escape' || e.code === 'Enter') hideInstr(); return; }
  if (e.code === 'Space') { e.preventDefault(); if (canShoot() && !G.aim) { G.charging = true; G.chargeT = 0; } }
  else if (e.code === 'KeyR') resetToLast();
  else if (e.code === 'KeyP' || (e.code === 'Escape' && Cam.ovTarget < 0.5)) setPaused(!G.paused);
  else if (e.code === 'Escape') toggleOverview();
  else if (e.code === 'KeyM') toggleSound();
  else if (e.code === 'KeyO') toggleOverview();
  else if (e.code === 'Equal' || e.code === 'NumpadAdd') Cam.dist = clamp(Cam.dist * 0.9, 3, 26);
  else if (e.code === 'Minus' || e.code === 'NumpadSubtract') Cam.dist = clamp(Cam.dist * 1.1, 3, 26);
  if (e.code.startsWith('Arrow')) e.preventDefault();
});
window.addEventListener('keyup', e => {
  keys[e.code] = false;
  if (e.code === 'Space' && G.charging) { G.charging = false; const f = [-Math.sin(Cam.yaw), -Math.cos(Cam.yaw)]; shoot(f[0], f[1], G.power); G.power = 0; }
});
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
  const s = window.innerHeight * renderer.getPixelRatio() / 2 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)); fx.mat.uniforms.uScale.value = fxAdd.mat.uniforms.uScale.value = s;
});
window.dispatchEvent(new Event('resize'));

// =====================================================================
//  HOOFDLUS
// =====================================================================
let lastT = performance.now(), acc = 0, loopErr = false;
// terug naar dit tabblad: geen grote sprong in de tijd
document.addEventListener('visibilitychange', () => { lastT = performance.now(); acc = 0; });
function safe(fn) { try { fn(); } catch (e) { if (!loopErr) { loopErr = true; console.error(e); } } }
const ballQ = new THREE.Quaternion(), axisV = new THREE.Vector3();
function updateAim(dt) {
  // toetsen: camera draaien / kantelen
  if (keys.ArrowLeft) Cam.yaw += dt * 1.6; if (keys.ArrowRight) Cam.yaw -= dt * 1.6;
  if (keys.ArrowUp) Cam.pitch = clamp(Cam.pitch - dt, 0.18, 1.35); if (keys.ArrowDown) Cam.pitch = clamp(Cam.pitch + dt, 0.18, 1.35);
  let dir = null, power = 0;
  if (G.charging) { if (!canShoot()) G.charging = false; else { G.chargeT += dt; const c = (G.chargeT / 1.3) % 2; power = c < 1 ? c : 2 - c; G.power = power; dir = [-Math.sin(Cam.yaw), -Math.cos(Cam.yaw)]; } }
  else if (G.aim) { if (!canShoot()) G.aim = null; else { dir = G.aim.dir; power = G.aim.power; } }
  $('powerMask').style.width = (100 - power * 100) + '%';
  $('powerLabel').textContent = dir ? `Kracht ${Math.round(power * 100)}%` : 'Kracht';
  const show = !!dir && power > 0.01;
  if (show) {
    const l = Math.hypot(dir[0], dir[1]), ux = dir[0] / l, uz = dir[1] / l, len = 0.6 + power * 6;
    for (let i = 0; i < AIM_N; i++) {
      const d = 0.35 + i * 0.32, m = aimDots[i];
      if (d > len) { m.visible = false; continue; }
      m.visible = true; const x = ball.x + ux * d, z = ball.z + uz * d; m.position.set(x, heightAt(x, z) + 0.08, z);
      m.material.color.copy(colorRamp(clamp(d / len, 0, 1) * power)); m.scale.setScalar(1 - i * 0.012);
    }
    const ex = ball.x + ux * (len + 0.25), ez = ball.z + uz * (len + 0.25);
    aimArrow.visible = true; aimArrow.position.set(ex, heightAt(ex, ez) + 0.1, ez); aimArrow.rotation.set(0, 0, 0);
    aimArrow.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(ux, 0, uz)); aimArrow.material.color.copy(colorRamp(power));
  } else { aimDots.forEach(m => m.visible = false); aimArrow.visible = false; }
  const ready = canShoot();
  ball.ring.visible = ready; ball.ring.position.set(ball.x, ball.y - BALL_R + 0.02, ball.z);
  ball.ring.material.opacity = 0.35 + Math.sin(performance.now() * 0.006) * 0.25;
}
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000; lastT = now; if (dt > 0.1) dt = 0.1;
  const running = !G.paused && H;
  if (running) {
    tickTimers(dt);
    // globale spelklok: H.t loopt in vaste stappen mee met de echte tijd (dt is begrensd op 0.1 s),
    // dus alle bewegende elementen (positie = functie van H.t) blijven altijd bewegen
    acc += dt; let steps = 0;
    while (acc >= STEP && steps < 16) { try { physicsStep(STEP); } catch (e) { H.t += STEP; if (!loopErr) { loopErr = true; console.error(e); } } acc -= STEP; steps++; }
    // rollende bal
    const prevX = ball.mesh.position.x, prevZ = ball.mesh.position.z;
    if (ball.state === 'rest' || ball.state === 'moving') {
      ball.y = heightAt(ball.x, ball.z) + BALL_R;
      if (ball.air > 0) { const u = clamp(1 - ball.air / ball.airT0, 0, 1); ball.y += 6.4 * u * (1 - u); }
      if (ball.held) ball.y += 0.5 + Math.sin(H.t * 9) * 0.15;
    }
    updateBallAnim(dt);
    ball.mesh.position.set(ball.x, ball.y, ball.z);
    const mx = ball.x - prevX, mz = ball.z - prevZ, md = Math.hypot(mx, mz);
    if (md > 1e-5 && md < 2) { axisV.set(mz, 0, -mx).normalize(); ballQ.setFromAxisAngle(axisV, md / BALL_R); ball.mesh.quaternion.premultiply(ballQ); }
    // subtiel spoor
    const sp = Math.hypot(ball.vx, ball.vz);
    if (ball.state === 'moving' && sp > 3 && Math.random() < dt * 40) fx.emit(ball.x, ball.y, ball.z, 0, 0.05, 0, 0.35, 0.14, ball.mesh.material.color, { alpha: 0.35, grow: -0.2 });
    for (const k of H.kins) if (k.visual) safe(() => k.visual(H.t, dt));
    GFX.time.value = H.t; GFX.gust.value = Math.max(0, Math.sin(H.t * 0.31) * Math.sin(H.t * 0.83 + 1.3)) * 1.4; // windstoten
    for (const u of H.updaters) safe(() => u(H.t, dt));
    fx.update(dt); fxAdd.update(dt);
    if (G.state === 'menu') Cam.orbit += dt * 0.08;
  }
  updateAim(dt);
  updateCamera(dt);
  renderer.render(scene, camera);
}

// ---------- start ----------
buildHole(0); applyEnvMaps(); resetBall(HOLES[0].start[0], HOLES[0].start[1]); showBest();
// Blender-decor: zodra het pakket van het menuthema binnen is de achtergrond opnieuw opbouwen, daarna de andere thema's laden
Promise.all([loadThemeModels('chars'), loadThemeModels(HOLES[0].theme.env)]).then(([c, ok]) => {
  if ((ok || c) && G.state === 'menu') { buildHole(0); applyEnvMaps(); resetBall(HOLES[0].start[0], HOLES[0].start[1]); }
  WORLD_ORDER.reduce((pr, env) => pr.then(() => loadThemeModels(env)), Promise.resolve());
});
['bQual', 'bQual2'].forEach(id => $(id).textContent = '⚙ Kwaliteit: ' + (Q.high ? 'hoog' : 'laag'));
requestAnimationFrame(frame);
// debug/test-hulpje
window.__mg = { G, H: () => H, ball, HOLES, loadHole, shoot, physicsStep, startGame, buildHole, resetBall, canShoot, showPick, showInstr, toMenu };
</script>
